name: Duino.lk Stock Tracker

on:
  schedule:
    # Runs once daily at 00:00 UTC (5:30 AM Sri Lanka time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hour safety timeout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: python scraper.py

      - name: Generate Report
        run: python report.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "Duino Stock Bot"
          git config --global user.email "bot@duino-tracker.local"
          git add data/
          git diff --cached --quiet || git commit -m "📊 Daily stock update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
